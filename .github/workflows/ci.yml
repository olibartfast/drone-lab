name: ci
on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-release
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            config: Release
            sanitizers: OFF
          - name: ubuntu-clang-debug-sanitizers
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            config: Debug
            sanitizers: ON
          - name: macos-clang-release
            os: macos-latest
            cc: clang
            cxx: clang++
            config: Release
            sanitizers: OFF
          - name: windows-msvc-release
            os: windows-latest
            cc: cl
            cxx: cl
            config: Release
            sanitizers: OFF
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DDRONE_LAB_BUILD_TESTS=ON
          -DDRONE_LAB_WARNINGS_AS_ERRORS=ON
          -DDRONE_LAB_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - name: Install
        run: cmake --install build --config ${{ matrix.config }} --prefix build/install

  simulator-contract:
    name: px4-gazebo-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test simulator helpers
        run: |
          python3 -m unittest discover -s simulation/px4-gazebo/tests -v
          python3 -m unittest discover -s simulation/scenarios/backyard_flyer/tests -v
      - name: Validate pinned environment
        run: python3 simulation/px4-gazebo/scripts/validate_environment.py
      - name: Verify pinned image manifest
        run: |
          set -a
          source simulation/px4-gazebo/versions.env
          docker manifest inspect "${PX4_GAZEBO_IMAGE}" >/dev/null
      - name: Validate compose model
        run: |
          docker compose \
            --env-file simulation/px4-gazebo/versions.env \
            -f simulation/px4-gazebo/compose.yaml \
            config --quiet
          docker compose \
            --env-file simulation/px4-gazebo/versions.env \
            -f simulation/scenarios/backyard_flyer/compose.yaml \
            config --quiet
          docker compose \
            --env-file simulation/px4-gazebo/versions.env \
            -f simulation/scenarios/backyard_flyer/compose.yaml \
            -f simulation/scenarios/backyard_flyer/compose.headless.yaml \
            config --quiet
          docker compose \
            --env-file simulation/px4-gazebo/versions.env \
            -f simulation/scenarios/backyard_flyer/compose.yaml \
            config --format json > /tmp/backyard-flyer-compose.json
          python3 simulation/scenarios/backyard_flyer/check_compose_contract.py \
            /tmp/backyard-flyer-compose.json
          docker compose \
            --env-file simulation/px4-gazebo/versions.env \
            -f simulation/scenarios/backyard_flyer/compose.yaml \
            -f simulation/scenarios/backyard_flyer/compose.gui.yaml \
            config --format json > /tmp/backyard-flyer-gui-compose.json
          python3 simulation/scenarios/backyard_flyer/check_compose_contract.py \
            /tmp/backyard-flyer-gui-compose.json --hardware
      - name: Validate smoke runner syntax
        run: |
          bash -n simulation/px4-gazebo/scripts/simulator_smoke.sh
          bash -n simulation/scenarios/backyard_flyer/bootstrap_mavsdk.sh
          bash -n simulation/scenarios/backyard_flyer/launch.sh
          python3 -m py_compile \
            simulation/scenarios/backyard_flyer/check_compose_contract.py \
            simulation/scenarios/backyard_flyer/check_result.py \
            simulation/scenarios/backyard_flyer/summarize_resources.py
